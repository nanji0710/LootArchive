<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=412, initial-scale=1.0">
<title>拾物集 新手引导 - 方案B预览</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 412px; height: 915px; margin: 20px auto;
  font-family: 'Fredoka', -apple-system, sans-serif;
  background: #FBF9F6; border-radius: 32px; overflow: hidden;
  position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

/* ── 背景渐变 ── */
.bg-warm {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 30%, #FFF4E6 0%, #FBF9F6 60%);
}

/* ── 装饰光斑 ── */
.glow-1 {
  position: absolute; width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(232,120,42,0.12) 0%, transparent 70%);
  top: -40px; right: -40px; border-radius: 50%;
}
.glow-2 {
  position: absolute; width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(124,58,237,0.08) 0%, transparent 70%);
  bottom: 120px; left: -30px; border-radius: 50%;
}

/* ── 主卡片区域 ── */
.slide-area {
  position: absolute; inset: 60px 0 140px 0;
  display: flex; align-items: center; justify-content: center;
}

/* ── 单张引导卡片 ── */
.card {
  width: 340px; padding: 36px 28px 28px;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.8);
  box-shadow: 0 8px 32px rgba(232,120,42,0.08), 0 2px 8px rgba(0,0,0,0.04);
  text-align: center;
  position: relative;
}
.card-icon {
  width: 72px; height: 72px; margin: 0 auto 20px;
  border-radius: 20px; display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.card-step {
  font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  color: #E8782A; text-transform: uppercase; margin-bottom: 6px;
}
.card h2 {
  font-size: 22px; font-weight: 700; color: #1C1917;
  margin-bottom: 10px; letter-spacing: -0.3px;
}
.card p {
  font-size: 14px; color: #78716C; line-height: 1.6;
  padding: 0 4px;
}

/* ── 底部指示器 + 按钮 ── */
.bottom-area {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 20px 28px 40px;
  text-align: center;
}
.dots {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 22px;
}
.dot {
  width: 8px; height: 8px; border-radius: 4px;
  background: #E0D8D0; transition: all 0.3s;
}
.dot.active { width: 24px; background: #E8782A; }

.btn-start {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 16px 48px;
  background: #E8782A; color: #fff; border: none;
  border-radius: 24px; font-size: 16px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.2px;
  box-shadow: 0 6px 20px rgba(232,120,42,0.25);
  transition: transform 0.15s;
}
.btn-start:active { transform: scale(0.97); }
.btn-skip {
  display: block; margin-top: 14px;
  background: none; border: none; color: #A8A29E;
  font-size: 13px; cursor: pointer;
}

/* ── 缩略图预览条 ── */
.preview-strip {
  position: absolute; bottom: 140px; left: 0; right: 0;
  display: flex; gap: 12px; justify-content: center; padding: 0 28px;
}
.preview-dot {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; cursor: pointer;
  transition: all 0.25s;
  border: 2px solid transparent;
}
.preview-dot.sel {
  border-color: #E8782A;
  background: rgba(232,120,42,0.08);
  transform: scale(1.08);
}

/* ── 特殊动画 ── */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.float { animation: float 3s ease-in-out infinite; }
</style>
</head>
<body>

<!-- Slide 1: 欢迎 -->
<div class="bg-warm"><div class="glow-1"></div><div class="glow-2"></div></div>
<div class="slide-area">
  <div class="card">
    <div class="card-icon float" style="background:rgba(232,120,42,0.1);">📦</div>
    <div class="card-step">STEP 1 / 5</div>
    <h2>欢迎来到拾物集</h2>
    <p>你的私人物品资产管理工具<br>拍照记录、分类整理、资产统计<br>一切都在本地，无需联网</p>
  </div>
</div>
<div class="preview-strip">
  <div class="preview-dot sel" style="background:rgba(232,120,42,0.1);">📦</div>
  <div class="preview-dot" style="background:rgba(0,0,0,0.03);">📸</div>
  <div class="preview-dot" style="background:rgba(0,0,0,0.03);">📊</div>
  <div class="preview-dot" style="background:rgba(0,0,0,0.03);">🏆</div>
  <div class="preview-dot" style="background:rgba(0,0,0,0.03);">🔍</div>
</div>
<div class="bottom-area">
  <div class="dots">
    <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <button class="btn-start">下一步 →</button>
  <button class="btn-skip">跳过引导</button>
</div>

</body>
</html>
