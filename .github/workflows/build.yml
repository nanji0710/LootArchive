name: 构建与发布

# 一次 push 到 main 就自动完成整条链路：单元测试 → 构建 APK → 自动打 Tag → 自动发布 Release。
#
# Tag 名固定是「V + version.json 里的 versionName」，所以「改版本号再 push」就等于发新版本。
# 只推提交、没改版本号时会这样处理：
#   Tag 指向本次提交   -> 刷新已有 Release（幂等，重复跑不会出错）
#   Tag 指向别的提交   -> 只构建 APK 并告警，绝不把旧版本重新发一遍
# 也保留手动推 Tag 触发，用于补发/重发某个版本。
on:
  push:
    branches: [ main ]
    tags:
      - 'V*'
      - 'v*'
  workflow_dispatch:

# 打 Tag 与发 Release 都需要写权限
permissions:
  contents: write

# 同一个分支上的构建串行执行。连推两次时若并行，两个运行会同时认为「Tag 还不存在」
# 而各自去打同一个 Tag，后一个就会因为 Tag 已存在而被拒绝，报出无意义的红灯。
# cancel-in-progress 保持 false：已开始的构建跑完，只让排在后面的等。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 取两个提交：下面的 versionCode 递进校验要读上一个提交的 version.json。
          # 只取 1 个（checkout 的默认行为）会让那道校验静默失效。
          fetch-depth: 2

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 缓存 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 本机为了下载速度用的是国内镜像（华为云 Gradle、阿里云 Maven）。
      # GitHub runner 在国内镜像上反而慢且容易抖，这里就地换回官方源。
      # 只影响 CI 这一次运行，不改仓库里的文件。
      - name: 改用官方源
        run: |
          set -euo pipefail
          sed -i 's|mirrors\.huaweicloud\.com/gradle/|services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          sed -i 's|^networkTimeout=.*|networkTimeout=60000|' \
            gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven\.aliyun\.com/d' settings.gradle.kts
          echo "--- gradle-wrapper.properties ---"
          grep -E 'distributionUrl|networkTimeout' gradle/wrapper/gradle-wrapper.properties
          echo "--- settings.gradle.kts 仓库列表 ---"
          grep -nE 'maven|google|gradlePluginPortal' settings.gradle.kts

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 读取版本信息
        id: ver
        run: |
          set -euo pipefail
          NAME_JSON=$(jq -r '.versionName' version.json)
          CODE_JSON=$(jq -r '.versionCode' version.json)
          NAME_GRADLE=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          URL_JSON=$(jq -r '.apkDownloadUrl' version.json)

          echo "version.json    -> versionName=$NAME_JSON versionCode=$CODE_JSON"
          echo "build.gradle.kts -> versionName=$NAME_GRADLE"

          if [ "$NAME_JSON" != "$NAME_GRADLE" ]; then
            echo "::error::版本号不一致：version.json 是 $NAME_JSON，app/build.gradle.kts 是 $NAME_GRADLE。两者必须一致，否则 APK 文件名、更新提示与下载地址会对不上。"
            exit 1
          fi

          # versionCode 才是 App 判断「有没有新版本」的依据（它只比 versionCode 的大小），
          # versionName 只是给人看的。只改版本名、忘记调大 versionCode 时，Release 照样能发
          # 出去，但所有用户都不会收到更新提示 —— 这种静默失败最难发现，所以在发布前拦住。
          #
          # 这里刻意不卡「主版本×100+次版本×10+修订号」这类公式：历史版本大多符合，但 6.11.0
          # 用的是 711 而不是 710（留过余量），卡公式会把当前的树判失败；而且 711 已经装在
          # 用户手机上了，改小会造成 INSTALL_FAILED_VERSION_DOWNGRADE。只校验单调递增。
          PREV_JSON=$(git show HEAD^:version.json 2>/dev/null || true)
          if [ -z "$PREV_JSON" ]; then
            echo "取不到上一个提交的 version.json（浅克隆或首次提交），跳过 versionCode 递进校验"
          else
            PREV_NAME=$(printf '%s' "$PREV_JSON" | jq -r '.versionName' 2>/dev/null || echo "")
            PREV_CODE=$(printf '%s' "$PREV_JSON" | jq -r '.versionCode' 2>/dev/null || echo "")
            case "$CODE_JSON" in
              ''|*[!0-9]*) echo "::error::version.json 的 versionCode 不是整数：$CODE_JSON"; exit 1 ;;
            esac
            case "$PREV_CODE" in
              ''|*[!0-9]*) echo "上一个提交的 versionCode 读不出来（$PREV_CODE），跳过递进校验" ;;
              *)
                if [ "$CODE_JSON" -lt "$PREV_CODE" ]; then
                  echo "::error::versionCode 回退了：上一个提交是 $PREV_CODE，这次是 $CODE_JSON。App 只认更大的 versionCode，回退后用户永远收不到更新。"
                  exit 1
                fi
                if [ "$NAME_JSON" != "$PREV_NAME" ] && [ "$CODE_JSON" -eq "$PREV_CODE" ]; then
                  echo "::error::版本号从 $PREV_NAME 改成了 $NAME_JSON，但 versionCode 还是 $PREV_CODE 没变。App 靠 versionCode 判断有没有新版本，不调大就不会提示更新。"
                  exit 1
                fi
                echo "versionCode 递进校验通过（$PREV_NAME/$PREV_CODE -> $NAME_JSON/$CODE_JSON）"
                ;;
            esac
          fi

          echo "name=$NAME_JSON" >> "$GITHUB_OUTPUT"
          echo "code=$CODE_JSON" >> "$GITHUB_OUTPUT"
          echo "url=$URL_JSON" >> "$GITHUB_OUTPUT"

      # 签名密钥：必须是这个 App 一直在用的那把，否则老用户无法覆盖安装，
      # 只能卸载重装（丢数据）。GitHub 自带的 debug keystore 每次都是随机生成的，不能用。
      - name: 检查签名密钥
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.LOOTARCHIVE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "已配置签名密钥，本次构建正式签名的 Release APK"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "未配置签名密钥，本次只构建 Debug APK（仅供验证能否编译通过）"
          fi

      # 目标 Tag 固定是「V + versionName」，这里先看清它当前是什么状态：
      #   missing   -> 远端还没有，稍后自动创建（正常发新版本的情况）
      #   same      -> 已有且指向本次提交，直接刷新已有 Release
      #   different -> 已有但指向旧提交，说明改了代码没改版本号，跳过发布
      #   manual    -> 手动推 Tag 触发，按推上来的那个 Tag 走
      - name: 确定要发布的 Tag
        id: tag
        env:
          HAVE_KEY: ${{ steps.sign.outputs.have }}
        run: |
          set -euo pipefail
          TAG="V${{ steps.ver.outputs.name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "手动推 Tag 触发，按 ${GITHUB_REF_NAME} 发布"
            echo "state=manual" >> "$GITHUB_OUTPUT"
            echo "publish=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REMOTE_TAGS=$(git ls-remote --tags origin)
          # 注解 Tag 要取 ^{} 解引用后的真实提交，轻量 Tag 直接就是提交
          REMOTE_SHA=$(printf '%s\n' "$REMOTE_TAGS" | awk -v t="refs/tags/$TAG^{}" '$2==t {print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA=$(printf '%s\n' "$REMOTE_TAGS" | awk -v t="refs/tags/$TAG" '$2==t {print $1}')
          fi
          echo "远端 Tag ${TAG} -> ${REMOTE_SHA:-（不存在）}"
          echo "本次提交        -> ${GITHUB_SHA}"

          if [ -z "$REMOTE_SHA" ]; then
            STATE=missing
          elif [ "$REMOTE_SHA" = "${GITHUB_SHA}" ]; then
            STATE=same
          else
            STATE=different
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

          if [ "$STATE" = "different" ]; then
            echo "::warning::版本号仍是 ${{ steps.ver.outputs.name }}，而 Tag $TAG 已指向别的提交，本次只构建 APK 不发布。要发新版本，请先改 app/build.gradle.kts 与 version.json 的版本号。"
            echo "publish=0" >> "$GITHUB_OUTPUT"
          elif [ "$HAVE_KEY" != "1" ]; then
            echo "::warning::未配置签名密钥，只能产出 Debug APK，跳过自动打 Tag 与发布。"
            echo "publish=0" >> "$GITHUB_OUTPUT"
          else
            echo "publish=1" >> "$GITHUB_OUTPUT"
          fi

      # Tag 名、version.json 的版本号、下载地址必须三者自洽，
      # 否则 App 内「检查更新」拿到的链接会 404
      - name: 校验版本号与下载地址
        env:
          TARGET_TAG: ${{ steps.tag.outputs.tag }}
          EXPECTED_URL: ${{ steps.ver.outputs.url }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "$TARGET_TAG" ]]; then
            echo "::error::Tag 名 ${GITHUB_REF_NAME} 与版本号不符，应为 $TARGET_TAG。请改 app/build.gradle.kts 与 version.json 的版本号后再重新打 Tag。"
            exit 1
          fi
          case "$EXPECTED_URL" in
            *"/${TARGET_TAG}/"*) echo "下载地址自洽: $EXPECTED_URL" ;;
            *) echo "::error::version.json 的 apkDownloadUrl 里不含 Tag 名 $TARGET_TAG：$EXPECTED_URL。App 内检查更新会下载失败。"
               exit 1 ;;
          esac

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # 发布必须用正确的签名，缺密钥就直接失败，不能发错包
      - name: 校验发布用的签名密钥
        if: steps.tag.outputs.publish == '1' && steps.sign.outputs.have != '1'
        run: |
          echo "::error::发布 Release 前必须先配置签名密钥。请在 Settings → Secrets and variables → Actions 里添加这 4 个 Secret：LOOTARCHIVE_KEYSTORE_BASE64、LOOTARCHIVE_KEYSTORE_PASSWORD、LOOTARCHIVE_KEY_ALIAS、LOOTARCHIVE_KEY_PASSWORD。"
          exit 1

      - name: 准备签名文件
        if: steps.sign.outputs.have == '1'
        env:
          KEYSTORE_BASE64: ${{ secrets.LOOTARCHIVE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          ls -l "$RUNNER_TEMP/signing/release.keystore"

      # --no-daemon 是必需的：Gradle 守护进程的环境变量在首次启动时固定，
      # 复用守护进程会让后面注入的签名环境变量读不到。
      # -x lintVitalRelease：lint 的 NullSafeMutableLiveData 检测器在本项目上会抛
      # IncompatibleClassChangeError（lint 自身缺陷，与代码无关），故跳过；发布前的
      # 静态把关靠上面的单元测试与下面的签名指纹校验。
      - name: 构建 Release APK
        if: steps.sign.outputs.have == '1'
        env:
          LOOTARCHIVE_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.keystore
          LOOTARCHIVE_KEYSTORE_PASSWORD: ${{ secrets.LOOTARCHIVE_KEYSTORE_PASSWORD }}
          LOOTARCHIVE_KEY_ALIAS: ${{ secrets.LOOTARCHIVE_KEY_ALIAS }}
          LOOTARCHIVE_KEY_PASSWORD: ${{ secrets.LOOTARCHIVE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -x lintVitalRelease --no-daemon --stacktrace
          ls -l app/build/outputs/apk/release/

      # 指纹写死在这里：它对应 App 已发布版本一直在用的那把签名证书。
      # 若这条报错，说明签名没接对，绝对不能发布，也不能拿去覆盖安装。
      - name: 校验签名指纹
        if: steps.sign.outputs.have == '1'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/LootArchive-release-v${{ steps.ver.outputs.name }}.apk"
          [ -f "$APK" ] || { echo "::error::没找到产物 $APK"; ls -l app/build/outputs/apk/release/; exit 1; }

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$SDK/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || { echo "::error::没找到 apksigner：$APKSIGNER"; exit 1; }
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 -i 'SHA-256 digest' | awk '{print $NF}')
          EXPECTED="6803e69fd87adfa9d71b70a8be37429ff3425cb7061dca8c27663728b95bb093"

          echo "实际签名指纹: $ACTUAL"
          echo "期望签名指纹: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹不匹配！用这个包发布，老用户升级会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载重装并丢失数据。请检查 Secret 里的 keystore 是不是这个 App 原本那把。"
            exit 1
          fi
          echo "APK 大小: $(stat -c%s "$APK") 字节"

      # 自动打 Tag：打在本次提交上，用检出时留下的 GITHUB_TOKEN 推送。
      # GITHUB_TOKEN 推出来的 Tag 不会再次触发工作流，所以不会自我循环。
      # 位置放在签名校验之后：只有确认是可发布的包，才允许留下 Tag。
      - name: 自动打 Tag
        if: steps.tag.outputs.publish == '1' && steps.tag.outputs.state == 'missing'
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          echo "已创建并推送 Tag $TAG -> ${GITHUB_SHA}"

      - name: 发布 Release
        if: steps.tag.outputs.publish == '1' && steps.sign.outputs.have == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          APK="app/build/outputs/apk/release/LootArchive-release-v${{ steps.ver.outputs.name }}.apk"
          TITLE="${TAG}更新"

          # 更新说明直接用 version.json 里的 updateLog，保证 App 内提示与 Release 页一致
          jq -r '.updateLog' version.json > "$RUNNER_TEMP/notes.md"
          echo "----- 更新说明 -----"; cat "$RUNNER_TEMP/notes.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在（$TAG），替换 APK 与说明"
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "新建 Release（$TAG）"
            gh release create "$TAG" "$APK" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # 提交到 main 时：有签名密钥就传 Release，没有才退回 Debug（仅供验证能否编译）
      - name: 构建 Debug APK（提交到 main 且未配置签名密钥时）
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.have != '1' }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 Debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.have != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: LootArchive-debug-v${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 提交到 main 时也上传一份正式签名的 Release APK，方便随时取包覆盖安装
      - name: 上传 Release APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.have == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: LootArchive-release-v${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
